name: Build APK

# Builds a release APK on every push to main and lets you trigger it by hand.
# Each successful build publishes a numbered GitHub Release (1, 2, 3, …) with
# the APKs attached — a plain https download link anyone can open, no GitHub
# account needed, so it's shareable with friends directly. /releases/latest
# always points at the newest one.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write # needed to create/update releases

env:
  # Releases are numbered 1, 2, 3, … Derived from the workflow run number
  # minus the runs burned on getting the toolchain versions right, so the
  # first real release is 1. Bump the offset only if run numbering is reset.
  VERSION_OFFSET: 6

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute version number
        id: ver
        run: echo "n=$(( ${{ github.run_number }} - ${{ env.VERSION_OFFSET }} ))" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # pubspec.yaml's floor (3.27.0) is lower than what's actually
          # resolvable: workmanager 0.9.x needs Flutter >=3.32.0. Using
          # "stable" with no pinned version tracks whatever's current.
          cache: true

      # Decode the release signing key. Without it Gradle falls back to a
      # debug key that is regenerated on every runner, so each build gets a
      # different signature and cannot be installed over the previous release
      # — which forces an uninstall and destroys the user's data.
      - name: Restore signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.p12
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Release keystore restored."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No KEYSTORE_BASE64 secret. This build will be debug-signed and CANNOT be installed over an existing RecallDay."
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze
        continue-on-error: true # don't block the APK build on lint warnings

      - name: Run tests
        run: flutter test

      - name: Build release APK (per-ABI split)
        # --build-name/--build-number stamp the release number into the APK, so
        # Android's app info and the GitHub release agree on the version.
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: >
          flutter build apk --release --split-per-abi
          --build-name=${{ steps.ver.outputs.n }}.0.0
          --build-number=${{ steps.ver.outputs.n }}

      - name: Publish release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ steps.ver.outputs.n }}
          name: RecallDay ${{ steps.ver.outputs.n }}
          body: |
            **RecallDay version ${{ steps.ver.outputs.n }}**

            Download **`app-arm64-v8a-release.apk`** — that's the right one for
            virtually every modern Android phone.

            ${{ steps.signing.outputs.signed == 'true' && 'Install it straight over your existing copy; your data is kept.' || '⚠️ Debug-signed build — you must uninstall first, which erases your data.' }}

            Built from commit ${{ github.sha }}.
          allowUpdates: true
          removeArtifacts: true
          makeLatest: true
          artifacts: >
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk,
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk,
            build/app/outputs/flutter-apk/app-x86_64-release.apk
          token: ${{ secrets.GITHUB_TOKEN }}
