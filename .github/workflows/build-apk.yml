name: Build APK

# Builds a release APK on every push to main and lets you trigger it by hand.
# Each successful build publishes a GitHub Release with the APKs attached — a
# plain https download link anyone can open, no GitHub account needed. The
# download page at https://ragul-personal.github.io/RecallDay/ (docs/index.html)
# points at /releases/latest/download/…, so it never needs updating.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write # needed to create/update releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Two different numbers, and conflating them broke things before.
      #
      # versionName ("1.0.0") is what users see, and comes from pubspec.yaml
      # and nowhere else — bump `version:` there to ship 1.0.1, 1.1.0, …
      #
      # versionCode is an invisible integer Android requires to NEVER decrease.
      # An APK whose code is below the installed one is refused as a downgrade
      # and can only be installed by uninstalling first, which wipes
      # app-private storage. Releases used to be numbered off the run number
      # and already reached 24 in the wild, so the code stays tied to the run
      # number — monotonic by definition — while the name restarts at 1.0.0.
      - name: Resolve version
        id: ver
        run: |
          name=$(sed -n 's/^version: *\([0-9][^+ ]*\).*/\1/p' pubspec.yaml | head -1)
          if [ -z "$name" ]; then
            echo "::error::Could not read version: from pubspec.yaml"
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "RecallDay $name (versionCode ${{ github.run_number }})"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # pubspec.yaml's floor (3.27.0) is lower than what's actually
          # resolvable: workmanager 0.9.x needs Flutter >=3.32.0. Using
          # "stable" with no pinned version tracks whatever's current.
          cache: true

      # Decode the release signing key. Without it Gradle falls back to a
      # debug key that is regenerated on every runner, so each build gets a
      # different signature and cannot be installed over the previous release
      # — which forces an uninstall and destroys the user's data.
      - name: Restore signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.p12
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Release keystore restored."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No KEYSTORE_BASE64 secret. This build will be debug-signed and CANNOT be installed over an existing RecallDay."
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze
        continue-on-error: true # don't block the APK build on lint warnings

      - name: Run tests
        run: flutter test

      - name: Build release APK (per-ABI split)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: >
          flutter build apk --release --split-per-abi
          --build-name=${{ steps.ver.outputs.name }}
          --build-number=${{ steps.ver.outputs.code }}

      # Tagged by version name, so pushing without bumping pubspec.yaml
      # refreshes the same release rather than piling up a new one per commit.
      - name: Publish release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ steps.ver.outputs.name }}
          name: RecallDay ${{ steps.ver.outputs.name }}
          commit: ${{ github.sha }}
          body: |
            **RecallDay ${{ steps.ver.outputs.name }}**

            Download **`app-arm64-v8a-release.apk`** — that's the right one for
            virtually every modern Android phone.

            ${{ steps.signing.outputs.signed == 'true' && 'Install it straight over your existing copy; your data is kept.' || '⚠️ Debug-signed build — you must uninstall first, which erases your data.' }}

            Built from commit ${{ github.sha }}.
          allowUpdates: true
          removeArtifacts: true
          makeLatest: true
          artifacts: >
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk,
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk,
            build/app/outputs/flutter-apk/app-x86_64-release.apk
          token: ${{ secrets.GITHUB_TOKEN }}
