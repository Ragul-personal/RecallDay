name: recallday
description: "RecallDay — personal spaced-repetition reminders. Local-only build."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'
  # workmanager 0.9.x requires Flutter >=3.32.0 — the floor used to say
  # 3.27.0, which made `flutter pub get` fail version solving on CI runners
  # pinned to that version.
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  # Used by BackupService to locate storage directories. Already resolved
  # transitively (2.1.5) — declared directly because we import it now.
  path_provider: ^2.1.5

  # Notifications & background
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  workmanager: ^0.9.0+3
  permission_handler: ^11.3.1
  flutter_timezone: ^3.0.1

  # UI
  google_fonts: ^6.2.1
  table_calendar: ^3.1.2
  fl_chart: ^0.68.0
  flutter_animate: ^4.5.0
  flutter_markdown_plus: ^1.0.3

  # Utilities
  intl: ^0.20.2
  uuid: ^4.4.0
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
